<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>命运织机 · AI RPG</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ════════════ 开场页 ════════════ -->
<div id="intro-screen" class="screen active">
  <div class="intro-container">

    <div class="intro-logo">
      <div class="logo-title">命 运 织 机</div>
      <div class="logo-sub">AI Dungeon Master · 你的每个选择，都由 AI 编织成命运</div>
    </div>

    <form id="setup-form" class="setup-form">

      <!-- 角色 -->
      <div class="section">
        <div class="section-header">
          <span class="section-emoji">⚔️</span>
          <span class="section-title">创建角色</span>
        </div>
        <div class="form-grid">
          <div class="form-row">
            <label>角色名</label>
            <input type="text" id="char-name" placeholder="如：艾琳" value="旅行者" />
          </div>
          <div class="form-row">
            <label>种族</label>
            <select id="char-race">
              <option value="人类">人类</option>
              <option value="精灵">精灵</option>
              <option value="矮人">矮人</option>
              <option value="兽人">兽人</option>
              <option value="恶魔">恶魔</option>
              <option value="不死者">不死者</option>
            </select>
          </div>
          <div class="form-row">
            <label>职业</label>
            <select id="char-class">
              <option value="战士">战士</option>
              <option value="法师">法师</option>
              <option value="盗贼">盗贼</option>
              <option value="牧师">牧师</option>
              <option value="游侠">游侠</option>
              <option value="术士">术士</option>
            </select>
          </div>
          <div class="form-row">
            <label>出生地</label>
            <select id="char-origin">
              <option value="王都·艾德加德">王都·艾德加德</option>
              <option value="幽暗密林·艾尔德文">幽暗密林·艾尔德文</option>
              <option value="铁炉堡·霍姆加德">铁炉堡·霍姆加德</option>
              <option value="边境废墟·破碎谷">边境废墟·破碎谷</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 属性分配 -->
      <div class="section">
        <div class="section-header">
          <span class="section-emoji">🎲</span>
          <span class="section-title">属性分配 <span class="point-hint">（剩余点数：<span id="points-left">20</span>）</span></span>
        </div>
        <div class="stats-row" id="stats-row"></div>
        <button type="button" id="randomize-stats" class="btn-secondary">🎲 随机分配</button>
      </div>

      <!-- 世界观 -->
      <div class="section">
        <div class="section-header">
          <span class="section-emoji">🌍</span>
          <span class="section-title">选择世界</span>
        </div>
        <div class="world-grid" id="world-grid"></div>
      </div>

      <!-- API 配置 -->
      <div class="section">
        <div class="section-header">
          <span class="section-emoji">🔌</span>
          <span class="section-title">AI 驱动端点 <span class="point-hint">（支持 OpenAI 兼容格式）</span></span>
        </div>
        <div class="form-grid">
          <div class="form-row">
            <label>接口地址 (Base URL)</label>
            <input type="text" id="api-url" placeholder="https://token.sensenova.cn/v1" value="https://token.sensenova.cn/v1" />
          </div>
          <div class="form-row">
            <label>API Key</label>
            <input type="password" id="api-key" placeholder="sk-xxx…xxxx" value="sk-vOH…1mjr" />
          </div>
          <div class="form-row">
            <label>模型名称</label>
            <input type="text" id="api-model" placeholder="sensenova-6.7-flash-lite" value="sensenova-6.7-flash-lite" />
          </div>
        </div>
        <div class="api-hints">
          <span class="hint">💡 推荐：<b>SenseNova 中转</b> → <code>https://token.sensenova.cn/v1</code></span>
          <span class="hint">💡 兼容：<b>OpenRouter</b> · <b>vLLM</b> · <b>Ollama</b> · <b>Any OpenAI-compatible API</b></span>
        </div>
      </div>

      <button type="submit" id="start-btn" class="btn-primary">🚀 开启命运之旅</button>
    </form>

    <div class="intro-footer">
      <span>⚠️ 所有数据保存在本地，不会上传至任何第三方服务器</span>
    </div>
  </div>
</div>

<!-- ════════════ 游戏主界面 ════════════ -->
<div id="game-screen" class="screen">
  <div id="game-layout">

    <!-- 顶部状态栏 -->
    <div id="status-bar" class="status-bar">
      <div class="status-left">
        <span class="status-name" id="sb-name"></span>
        <span class="status-race" id="sb-race"></span>
        <span class="status-class" id="sb-class"></span>
        <span class="status-location" id="sb-location"></span>
      </div>
      <div class="status-right">
        <span class="status-hp" id="sb-hp"></span>
        <span class="status-mp" id="sb-mp"></span>
        <span class="status-gold" id="sb-gold"></span>
        <span class="status-level" id="sb-level"></span>
      </div>
      <div class="status-actions">
        <button id="btn-inventory" class="btn-mini" title="物品栏">🎒 物品</button>
        <button id="btn-relationships" class="btn-mini" title="关系">👥 关系</button>
        <button id="btn-quests" class="btn-mini" title="任务">📜 任务</button>
        <button id="btn-settings" class="btn-mini" title="设置">⚙️</button>
        <button id="btn-save" class="btn-mini" title="保存">💾</button>
        <button id="btn-continue" class="btn-mini" title="续写">✨</button>
      </div>
    </div>

    <!-- 剧情输出区 -->
    <div id="story-panel" class="story-panel">
      <div id="story-content"></div>
    </div>

    <!-- 输入区 -->
    <div id="input-panel" class="input-panel">
      <div id="typing-indicator" class="typing-indicator hidden">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="typing-text">命运正在编织中…</span>
      </div>
      <form id="action-form" class="action-form">
        <div class="quick-actions" id="quick-actions"></div>
        <div class="input-row">
          <input type="text" id="action-input" placeholder="描述你的行动…（如：走向酒馆大门，举起长矛，对守卫说"我接到国王密令"）" autocomplete="off" />
          <button type="submit" id="send-btn" class="btn-send">发送 ⬆</button>
        </div>
      </form>
    </div>

  </div>
</div>

<!-- ════════════ 设置弹窗 ════════════ -->
<div id="settings-modal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-content">
    <div class="modal-header">
      <h2>⚙️ 游戏设置</h2>
      <button class="modal-close" id="settings-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <label>AI 接口地址</label>
        <input type="text" id="set-api-url" />
      </div>
      <div class="form-row">
        <label>API Key</label>
        <input type="password" id="set-api-key" />
      </div>
      <div class="form-row">
        <label>模型名称</label>
        <input type="text" id="set-api-model" />
      </div>
      <div class="form-row">
        <label>温度 (Creativity, 0-2)</label>
        <input type="number" id="set-temp" min="0" max="2" step="0.1" value="0.9" />
      </div>
      <div class="form-row">
        <label>每次最大 Token</label>
        <input type="number" id="set-max-tokens" min="500" max="16384" value="4096" />
      </div>
      <button type="button" id="save-settings" class="btn-primary">保存设置</button>
      <button type="button" id="reset-game" class="btn-danger">🗑️ 重置游戏（清除所有进度）</button>
    </div>
  </div>
</div>

<!-- 物品栏弹窗 -->
<div id="inventory-modal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-content">
    <div class="modal-header">
      <h2>🎒 物品栏</h2>
      <button class="modal-close" id="inv-close">✕</button>
    </div>
    <div class="modal-body" id="inventory-list"></div>
  </div>
</div>

<!-- 关系弹窗 -->
<div id="relationships-modal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-content">
    <div class="modal-header">
      <h2>👥 人物关系</h2>
      <button class="modal-close" id="rel-close">✕</button>
    </div>
    <div class="modal-body" id="relationships-list"></div>
  </div>
</div>

<!-- 任务弹窗 -->
<div id="quests-modal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-content">
    <div class="modal-header">
      <h2>📜 任务日志</h2>
      <button class="modal-close" id="qst-close">✕</button>
    </div>
    <div class="modal-body" id="quests-list"></div>
  </div>
</div>

<script src="js/ai.js"></script>
<script src="js/game.js"></script>
</body>
</html>
